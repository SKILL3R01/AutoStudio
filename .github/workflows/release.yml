name: Release desktop app

# Push a version tag (e.g. `git tag v1.0.1 && git push origin v1.0.1`) to build the Windows app
# and publish it as a GitHub Release. Can also be started by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installer + portable exe
        run: npm run dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoStudio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            web/release/AutoStudio-Setup-*.exe
            web/release/AutoStudio-Portable-*.exe

      - name: Keep build as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: AutoStudio-windows
          path: web/release/*.exe
